name: Build profile assets

on:
  push:
    branches: [main]
    paths: [scripts/**, data/**, .github/workflows/build.yml]
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-build
  cancel-in-progress: true

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit refreshed assets
        run: |
          git config user.name "SAY-5"
          git config user.email "say.apm35@gmail.com"
          git add assets README.md
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "chore: refresh profile assets" && git pull --rebase origin main && git push; fi

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: SAY-5
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#cdf53a&color_dots=#161b22,#2b3a10,#4d6a1e,#8fb424,#cdf53a
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
